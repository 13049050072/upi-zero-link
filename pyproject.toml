[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-zero-link"
version = "1.1.1"
description = "India ₹0 UPI Autopay mandate link extractor (protocol-level, no browser)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "curl_cffi>=0.7",
    "requests>=2.31",
]

[project.scripts]
upi-zero-link = "upi_zero_link.cli:main"
upi-zero-link-server = "upi_zero_link.server:main"

[tool.setuptools]
packages = ["upi_zero_link", "upi_zero_link._vendor"]

[tool.setuptools.package-data]
upi_zero_link = ["data/*.json", "_vendor/sentinel_assets/*"]
