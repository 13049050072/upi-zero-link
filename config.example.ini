# Copy this file to server.ini and replace the placeholders locally.
# Do not commit server.ini: it contains your private CDK and proxy credentials.
[server]
# Your private service credential. Never use a real credential in this example.
cdk = replace-with-your-own-cdk

# 0 means unlimited successful requests for this self-use service.
max_uses = 0

host = 0.0.0.0
port = 8080
workers = 4
queue_limit = 500
job_ttl = 900

# Each line accepts either a proxy URL or provider format host:port:user:password.
# Four-part values are treated as HTTP proxies and normalized internally.
# Keep each proxy stable for the complete UPI flow.
proxies =
    http://user:password@india-exit-1.example:1080
    india-exit-2.example:1080:proxy-user:proxy-password
